name: CI

on:
  push:
    branches:
      - main
      - 0.1.0
  pull_request:

jobs:
  frontend:
    name: TypeScript & ShadCN/UI Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  backend-and-installer:
    name: Rust Backend & Ratatui TUI Installer Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev poppler-utils
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
            build_script/tui-installer/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run Rust Backend unit tests
        run: cargo test --manifest-path backend/Cargo.toml
      - name: Check Ratatui TUI Installer
        run: cargo check --manifest-path build_script/tui-installer/Cargo.toml
