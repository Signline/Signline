[package]
name = "signline-backend"
version = "0.1.0-beta"
edition = "2021"
authors = ["c0fe"]
license = "AGPL-3.0-only"
description = "Signline v0.1.0b (Beta) — Modular Rust Backend with PocketBase persistence, PDF stamping, and X.509/PKCS#7 signing"

[dependencies]
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1.40", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "limit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
bcrypt = "0.15"
jsonwebtoken = "9.3"
rand = "0.8"
lopdf = "0.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
urlencoding = "2.1"
regex = "1.10"
csv = "1.3"
bytes = "1.7"
http = "1.1"
mime_guess = "2.0"
tempfile = "3.12"
